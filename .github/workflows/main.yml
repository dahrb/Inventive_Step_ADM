name: Unit Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        version: "latest"

    - name: Install test dependencies (uv)
      # Only the lightweight ADM test deps — the full vLLM/torch stack is not needed
      # for Tests/test_ADM.py and cannot build on a CPU runner.
      run: |
        uv venv --python 3.12
        uv pip install --group test

    - name: Run test_ADM.py
      # cd into Tests so `from ADM_Construction import ...` resolves via the ADM path.
      working-directory: ./Tests
      run: |
        uv run --no-project python -m unittest test_ADM.py -v
